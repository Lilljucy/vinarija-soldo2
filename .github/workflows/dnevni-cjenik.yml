name: Dnevni cjenik (sidrena cijena)

on:
  schedule:
    # 04:17 UTC = 05:17 CET / 06:17 CEST, radnim danom; ~1h45 margine do roka 8:00 (GitHub zna kasniti)
    - cron: '17 4 * * 1-5'
  push:
    paths:
      - 'data/cjenik-proizvoda.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generiraj:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_RsOck00DmBPwHBlfmANTiDzU
      VERCEL_PROJECT_ID: prj_owxoeircxTAmIMq3GfYjgyK6sz3d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Primijeni cijene iz JSON-a na stranice (hr/en/de)
        run: node scripts/primijeni-cijene.mjs

      - name: Generiraj CSV cjenik
        run: node scripts/generiraj-cjenik.mjs   # XML cjenik + arhiva

      - name: Commit i push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A cjenik-arhiva/ cjenik-proizvoda.xml data/pohrana-brojac.json vina.html en/vina.html de/vina.html
          git diff --cached --quiet && echo "Nema promjena" && exit 0
          git commit -m "Dnevna objava cjenika ($(date -u +%Y-%m-%d))"
          git push

      - name: Deploy na Vercel (ako je postavljen VERCEL_TOKEN secret)
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel deploy --prod --yes --token "$VERCEL_TOKEN"
